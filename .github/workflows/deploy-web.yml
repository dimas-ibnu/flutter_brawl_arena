name: Deploy web to GitHub Pages

# Builds the web version with the Firebase settings from the
# FIREBASE_ENV_JSON secret and publishes it to GitHub Pages:
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get

      # Don't publish a build that fails its tests.
      - run: flutter test

      # Written from the secret for this build only; never committed.
      - name: Firebase settings
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
        run: |
          if [ -z "$FIREBASE_ENV_JSON" ]; then
            echo "::warning::FIREBASE_ENV_JSON secret is missing; online play will be off"
            echo '{}' > firebase.env.json
          else
            printf '%s' "$FIREBASE_ENV_JSON" > firebase.env.json
          fi

      # Pages serves the site from /<repo>/, so the app needs that base path.
      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define-from-file=firebase.env.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
